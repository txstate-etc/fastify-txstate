services:
  fastify-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    attach: true
    depends_on:
      - fastify-http
      - fastify-https
      - otel-collector
  fakeauth:
    image: registry.its.txstate.edu/unified-auth-stub:dev
    attach: false
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    attach: false
    command: [--config=/etc/otelcol/test-config.yaml]
    volumes:
      - ./test/otel-collector.yaml:/etc/otelcol/test-config.yaml:ro
  fastify-http:
    build:
      context: .
      dockerfile: Dockerfile.http
    attach: false
    environment:
      NODE_ENV: development
      JWT_TRUSTED_ISSUERS: '[{ "iss": "unified-auth", "url": "http://fakeauth/jwks" }, { "iss": "http://fakeauth", "type": "oauth", "url": "http://fakeauth" }]'
      JWT_TRUSTED_CLIENTIDS: fastify-test
      UA_URL: 'http://fakeauth'
      UA_COOKIE_CLIENTID: fastify-test
      UA_COOKIE_NAME: fastify_token
  fastify-https:
    build:
      context: .
      dockerfile: Dockerfile.https
    attach: false
    hostname: fastify-https-pod
    depends_on:
      - otel-collector
    environment:
      KUBERNETES_SERVICE_HOST: 10.0.0.1
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: fastify-https
      CI_GIT_VERSION: v1.2.3
      OTEL_METRIC_EXPORT_INTERVAL: 1000
      OTLP_PASSWORD: unused
      JWT_TRUSTED_ISSUERS: '[{ "iss": "unified-auth", "url": "http://fakeauth/jwks" }]'
      UA_URL: 'http://fakeauth'
